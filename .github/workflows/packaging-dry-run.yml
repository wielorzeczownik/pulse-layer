name: Packaging dry run

on: pull_request

permissions: {}

jobs:
  build-artifacts:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: universal-apple-darwin
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-2025
            target: i686-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: overlay/package.json
          cache: npm
          cache-dependency-path: overlay/package-lock.json

      - name: Install Linux system dependencies
        if: ${{ runner.os == 'Linux' }}
        run: bash scripts/install-linux-deps.sh

      - name: Build
        if: ${{ matrix.target != 'universal-apple-darwin' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build universal macOS binary
        if: ${{ matrix.target == 'universal-apple-darwin' }}
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            cargo build --release --locked --target "${arch}-apple-darwin"
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/pulse-layer \
            target/aarch64-apple-darwin/release/pulse-layer \
            target/x86_64-apple-darwin/release/pulse-layer

      - name: Install cargo-packager
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          # renovate: datasource=crate depName=cargo-packager
          tool: cargo-packager@0.11.8

      - name: Package macOS app
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo packager --release --target "$TARGET" --formats app,dmg
          out="target/${TARGET}/release"
          mkdir -p dist
          tar -C "$out" -czf "dist/pulse-layer-${TARGET}.tar.gz" PulseLayer.app
          cp "$out"/PulseLayer_*.dmg "dist/pulse-layer-${TARGET}.dmg"

      - name: Package Windows exe
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path "target/$env:TARGET/release/pulse-layer.exe" `
            -DestinationPath "dist/pulse-layer-$env:TARGET.zip"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package Windows installer
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo packager --release --target "$TARGET" --formats nsis
          cp target/"$TARGET"/release/*-setup.exe "dist/pulse-layer-${TARGET}-setup.exe"

      - name: Package Linux binary
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "target/${TARGET}/release" \
            -czf "dist/pulse-layer-${TARGET}.tar.gz" \
            pulse-layer

      - name: Package Linux installers
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo packager --release --target "$TARGET" --formats deb,appimage
          out="target/${TARGET}/release"
          cp "$out"/*.deb "dist/pulse-layer-${TARGET}.deb"
          cp "$out"/*.AppImage "dist/pulse-layer-${TARGET}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

